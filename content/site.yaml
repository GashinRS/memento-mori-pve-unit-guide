assumptions:
  title: Before You Read
  cards:
    - title: Character Rarity Requirements
      icon: "&#9733;"
      text: |
        As a general rule of thumb, support units only require one copy, and having more often does not yield
        better performance. The expected rarity for every unit in this list will be visible from the icons
        used. When a character performs noticeably better at higher rarities, this will be clearly stated
        in the unit's section.
    - title: Progression Badges
      icon: "&#8987;"
      text: |
        The Early Game, Mid Game and End Game badges are rough indicators for when a unit starts becoming useful.
        They do not mean a unit stops being useful later. If a unit has the Early Game badge, it can still be useful
        in Mid Game or End Game; the badge only marks the point where the unit generally starts to matter.

        The level ranges are rough guidelines, not hard rules. Depending on your account, gear, team options and the
        stage you are trying to clear, some units can become useful earlier or later than listed.
    - title: External Guides
      icon: "&#9888;"
      text: |
        Not all external resources are equally reliable. In my experience, Game8's Memento Mori guides frequently omit
        important context or give recommendations that do not hold up in practice, so I recommend taking their advice 
        with a grain of salt.
    - title: Why There Is No Tier List
      icon: "&#8800;"
      text: |
        This guide intentionally does not include a tier list. There are too many variables such as progression, game mode,
        team building and enemy lineup that can change the value of a unit. It is not possible to accurately capture
        all this information in a tier list without making it overcomplicated. You should therefore also be careful
        with any tier lists you do see for this game.
glossary:
  title: Glossary
  terms:
    - term: Enfeeble
      definition: |
        This debuff decreases a character's ATK.
        Unlike normal Decreased Stat debuffs,
        the amount a target's stat is decreased by via Enfeeble is calculated based on their in-battle stat.
    - term: Multi-Barrier
      aliases: [Multi-Barriers]
      definition: |
        This buff provides a multi-layered barrier.
        When a character takes damage,
        1 barrier layer is depleted to nullify that damage.
        If Multi-Barrier is overlapped with Invulnerable, the barrier layer will not be depleted.
        If Multi-Barrier is overlapped with Shield, Multi-Barrier will be used first.
    - term: Force Field
      aliases: [Force Field]
      definition: |
        This buff reduces a designated amount of damage from attacks, Resonance, Devotion, and counterattack damage.
        Damage from Poison and other debuffs that deal continuous damage cannot be reduced.
        The effects of Increased/Decreased Damage Taken and Increased/Decreased Damage Dealing
        are calculated before damage is reduced via Force Field.
        The effects of Shield, Resonance, and Devotion are calculated after damage is reduced via Force Field.
        When the effect of multiple Force Fields activates, or when the effects of Force Field and cutting activate at the same time,
        the only effect that will be applied will be the one that results in the least amount of damage being ultimately dealt to the character.
    - term: Invisibility
      definition: |
        This buff prevents a character from being a target of attacks and skills of enemies and allies.
        If all allies who are alive are enhanced with Invisibility, the effect of Invisibility will be nullified.
    - term: Buff Immunity
      definition: |
        This debuff prevents buffs from being granted to a character.
        This does not nullify any buffs a character is already enhanced with.
        While a character is afflicted with Buff Immunity, if a buff updates the value of a stat, etc., when specific conditions are met, those increases will not be applied.
        Buff Immunity does not affect buffs that cannot be dispelled.
    - term: Berserk
      definition: |
        After each turn, increases damage dealt by 10%.
        [Debuff Immunity] Becomes immune to debuffs (cannot be dispelled).
    - term: Direct Damage
      definition: |
        Direct damage ignores all enemy defense stats and is not affected by the attackers attacking stats 
        (unless explicitly mentioned in the skill description) as well as PMDB.
    - term: UW
      aliases: [UWs]
      definition: Unique Weapon
    - term: PMDB
      definition: Physical/Magical Defense Break
    - term: DR
      definition: Damage Reduction
