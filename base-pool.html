<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memento Mori - Base Pool Unit Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
    <script src="data/generated-content.js?v=20260828-video-clears"></script>
    <script src="scripts/shared-ui.js?v=20260828-video-clears"></script>
    <link rel="stylesheet" href="style.css?v=20260828-video-clears">
</head>
<body id="top">
<a class="back-to-top" href="#top" aria-label="Back to top">↑</a>
<div class="page-wrap">

    <header id="site-header"></header>

    <nav class="nav page-nav">
        <a href="index.html">Limited PvE Guide</a>
        <a href="base-pool.html" aria-current="page">Base Pool Guide</a>
        <a href="concepts.html">PvE Notes</a>
    </nav>

    <div id="wip-banner"></div>

    <div id="base-pool-intro"></div>

    <div id="base-pool-overview"></div>

    <div data-guide-legend></div>

    <div id="mount"></div>

    <footer id="site-footer"></footer>

</div>

<script>
    function textHtml(text) {
        return String(text || '').replace(/\n/g, '<br>');
    }

    function imgFB(src, alt, fb) {
        return '<img src="' + src + '" alt="' + alt + '" data-fallback-image>' + fb;
    }

    document.addEventListener('error', function(event) {
        var image = event.target;
        if (!image.matches || !image.matches('img[data-fallback-image]')) return;
        image.style.display = 'none';
        if (image.nextElementSibling) image.nextElementSibling.style.display = 'flex';
    }, true);

    function unitAnchor(unit) {
        return 'unit-' + unit.id;
    }

    function unitIcon(id, size) {
        size = size || '4.75rem';
        return '<div class="unit-icon" style="width:' + size + ';height:' + size + '">' +
            imgFB('icons/units/' + id + '.png', id,
                '<div class="placeholder-label" style="display:none">Unit<br>Icon</div>') +
            '</div>';
    }

    function renderWeapons(weapons) {
        if (!weapons || weapons.length === 0) {
            return '<span class="no-weapon-badge">No weapon needed</span>';
        }
        var icons = weapons.map(function(w) {
            var tierLabel = { optional: 'Optional', recommended: 'Recommended', required: 'Required' }[w.tier] || w.tier;
            var tipText = tierLabel + (w.description ? ' - click for details' : '');
            var markerDots = { optional: 0, recommended: 1, required: 2 }[w.tier] || 0;
            var marker = '<div class="weapon-marker ' + w.tier + '" aria-hidden="true">' +
                Array(markerDots + 1).join('<span></span>') +
                '</div>';
            return '<button type="button" class="weapon-wrap" onclick="selectWeapon(this)"' +
                ' data-description="' + encodeURIComponent(w.description || '') + '" aria-expanded="false"' +
                ' aria-label="' + w.level + ' ' + tierLabel + (w.description ? ', click for details' : '') + '">' +
                '<div class="weapon-icon ' + w.tier + '">' +
                imgFB('icons/weapons/' + w.level + '.png', w.level, '') +
                '</div>' +
                marker +
                '<div class="weapon-tooltip">' + tipText + '</div>' +
                '</button>';
        }).join('');
        return icons + '<div class="weapon-detail-panel" aria-live="polite">' +
            '<div class="weapon-detail-content"></div>' +
            '</div>';
    }

    function selectWeapon(button) {
        var row = button.closest('.weapons-row');
        var panel = row.querySelector('.weapon-detail-panel');
        var content = panel.querySelector('.weapon-detail-content');
        var wasActive = button.classList.contains('active');
        row.querySelectorAll('.weapon-wrap.active').forEach(function(activeButton) {
            activeButton.classList.remove('active');
            activeButton.setAttribute('aria-expanded', 'false');
        });

        if (wasActive || !button.dataset.description) {
            panel.classList.remove('visible');
            content.textContent = '';
            return;
        }

        button.classList.add('active');
        button.setAttribute('aria-expanded', 'true');
        content.textContent = decodeURIComponent(button.dataset.description);
        panel.classList.add('visible');
    }

    function renderStageBadge(stage) {
        if (!stage) return '';
        var labels = { early: 'Early Game', mid: 'Mid Game', end: 'End Game' };
        return '<div class="stage-badges">' +
            '<span class="stage-badge ' + stage + '">' + (labels[stage] || stage) + '</span>' +
            '</div>';
    }

    function renderUnitName(unit) {
        var wikiLink = unit.wiki ?
            '<a class="unit-wiki-link" href="' + unit.wiki + '" target="_blank" rel="noopener noreferrer"' +
            ' aria-label="View ' + unit.name + '\'s full kit on the MementoMori Wiki"' +
            ' title="View full kit on Fandom">&#8599;</a>' : '';
        return '<div class="unit-name-row"><div class="unit-name">' + unit.name + '</div>' + wikiLink + '</div>';
    }

    function basePoolUnitAnchors() {
        var anchors = {};
        BASE_POOL_UNITS.forEach(function(unit) {
            anchors[unit.id] = unitAnchor(unit);
            anchors[unit.name] = unitAnchor(unit);
            (unit.aliases || []).forEach(function(alias) {
                anchors[alias.id] = unitAnchor(unit);
                anchors[alias.name] = unitAnchor(unit);
            });
        });
        return anchors;
    }

    function renderTeams(teams) {
        if (!teams || !teams.length) return '';
        var anchors = basePoolUnitAnchors();
        var rows = teams.map(function(team) {
            var slots = team.slots.map(function(slot) {
                var icon = '<div class="team-slot">' +
                    imgFB('icons/units/' + slot.id + '.png', slot.name,
                        '<div class="slot-placeholder" style="display:none"></div>') +
                    '</div>';
                var target = anchors[slot.id] || anchors[slot.name];
                if (target) {
                    icon = '<a class="team-slot-link" href="#' + target + '" aria-label="Go to ' + slot.name + '">' +
                        icon +
                        '</a>';
                }
                return '<div class="tip-icon">' +
                    icon +
                    '<div class="tip">' + slot.name + '</div>' +
                    '</div>';
            }).join('');
            var label = team.label
                ? '<span class="team-label">' + team.label + '</span>'
                : '';
            var video = GuideUI.videoLinkHtml(team.video, team.label || 'this team clear', 'team-video-link');
            var meta = label || video ? '<div class="team-meta">' + label + video + '</div>' : '';
            return '<div class="team-row">' + slots + meta + '</div>';
        }).join('');
        return '<div class="teams-section">' +
            '<div class="row-label">Team Examples</div>' + rows +
            '</div>';
    }

    function renderCard(unit) {
        return '<div class="unit-card base-pool-card" id="' + unitAnchor(unit) + '">' +
            '<div class="unit-top">' +
            '<div class="unit-portrait">' +
            unitIcon(unit.id) +
            renderStageBadge(unit.stage) +
            '</div>' +
            '<div class="unit-meta">' +
            renderUnitName(unit) +
            '<div class="unit-role">' + unit.role +
            (unit.scalable ? ' <span class="copies-badge">&#8679; scales with copies</span>' : '') +
            '</div>' +
            '<div class="weapons-row">' +
            '<span class="weapons-label">Weapon</span>' +
            renderWeapons(unit.weapons) +
            '</div>' +
            '</div>' +
            '</div>' +
            '<div class="card-divider"></div>' +
            '<details class="unit-details">' +
            '<summary><span class="closed-label">View More</span><span class="open-label">View Less</span></summary>' +
            renderTeams(unit.teams) +
            GuideUI.exampleClearsHtml(unit.exampleClears) +
            '<div class="unit-desc">' + unit.desc.trim() + '</div>' +
            '</details>' +
            '</div>';
    }

    function renderHeader() {
        document.getElementById('site-header').innerHTML =
            '<p class="header-eyebrow">' + BASE_POOL_CONTENT.header.eyebrow + '</p>' +
            '<h1>' + textHtml(BASE_POOL_CONTENT.header.title) + '</h1>' +
            '<p class="header-sub">' + BASE_POOL_CONTENT.header.subtitle + '</p>' +
            '<p class="last-updated">Last updated ' + SITE_CONTENT.lastUpdated + '</p>';
    }

    function renderIntro() {
        document.getElementById('base-pool-intro').innerHTML =
            '<section class="base-guide-intro">' +
            '<div class="overview-header">' +
            '<h2>' + BASE_POOL_CONTENT.intro.title + '</h2>' +
            '<div class="overview-line"></div>' +
            '</div>' +
            '<div class="base-guide-intro-text">' + BASE_POOL_CONTENT.intro.text + '</div>' +
            '</section>';
    }

    function renderWip() {
        var wip = SITE_CONTENT.wip;
        document.getElementById('wip-banner').innerHTML =
            '<div class="wip-banner">' +
            '<div class="wip-icon">&#9998;</div>' +
            '<div class="wip-body">' +
            '<div class="wip-title">' + wip.title + '</div>' +
            '<div class="wip-text">' + wip.text + '</div>' +
            '<ul class="wip-list">' + wip.items.map(function(item) {
                return '<li>' + item + '</li>';
            }).join('') + '</ul>' +
            '</div>' +
            '</div>';
    }

    function renderOverview() {
        document.getElementById('base-pool-overview').innerHTML =
            '<div class="unit-overview">' +
            '<div class="overview-header">' +
            '<h2>Unit Index</h2>' +
            '<div class="overview-line"></div>' +
            '</div>' +
            '<div class="overview-icons base-overview-icons">' +
            BASE_POOL_UNITS.map(function(unit) {
                return '<a class="overview-icon tip-icon" href="#' + unitAnchor(unit) + '" aria-label="' + unit.name + '">' +
                    imgFB('icons/units/' + unit.id + '.png', unit.name,
                        '<div class="overview-placeholder" style="display:none">?</div>') +
                    '<span class="tip">' + unit.name + '</span>' +
                    '</a>';
            }).join('') +
            '</div>' +
            '</div>';
    }

    function renderFooter() {
        document.getElementById('site-footer').innerHTML =
            '<p class="footer-credits">' + BASE_POOL_CONTENT.footer.credits + '</p>' +
            '<p>' + BASE_POOL_CONTENT.footer.disclaimer + ' <span>' + BASE_POOL_CONTENT.footer.brand + '</span>.</p>';
    }

    function setupBackToTop() {
        var button = document.querySelector('.back-to-top');
        function updateButton() {
            button.classList.toggle('visible', window.scrollY > 500);
        }
        window.addEventListener('scroll', updateButton, { passive: true });
        updateButton();
    }

    document.getElementById('mount').innerHTML =
        '<section class="section-block base-pool-section" data-cat="general">' +
        '<div class="section-header">' +
        '<h2>Base Pool Units</h2>' +
        '<div class="section-line"></div>' +
        '</div>' +
        '<div class="unit-grid">' + BASE_POOL_UNITS.map(renderCard).join('') + '</div>' +
        '</section>';

    renderHeader();
    renderWip();
    renderIntro();
    renderOverview();
    renderFooter();
    setupBackToTop();
</script>
</body>
</html>
